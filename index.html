<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand FX — Glitch Frame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><h1>Hand FX <span>▣</span></h1><p>Pinch the corners with your fingertips and build a live glitch frame.</p></header>
  <section class="controls">
    <button id="start">Start Camera</button>
    <select id="filter" aria-label="Effect">
      <option value="glitch">Glitch Frame</option>
      <option value="neon">Neon Frame</option>
      <option value="scan">Scanline</option>
      <option value="rgb">RGB Split</option>
    </select>
    <label class="toggle"><input id="mirror" type="checkbox" checked> Mirror</label>
  </section>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="hud"><span id="status">Camera off</span><span id="hands">0 hands</span></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="app.js"></script>
</body>
</html>
